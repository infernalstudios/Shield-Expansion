modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/infernalstudios/Shield-Expansion/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "${mod_id}.png"
credits = '''${credits}'''
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "cloth_config"
type = "optional"
versionRange = "[11.1.118,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "bettercombat"
type = "optional"
versionRange = "[1.7.0,)"
ordering = "BEFORE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "savage_and_ravage"
type = "optional"
versionRange = "[6.0.0,)"
ordering = "BEFORE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "miningmaster"
type = "optional"
versionRange = "[4.0.0,)"
ordering = "BEFORE"
side = "BOTH"